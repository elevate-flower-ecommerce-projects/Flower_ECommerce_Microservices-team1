openapi: 3.0.3
info:
  title: Elevate Flower E-Commerce Microservices API
  version: 1.0.0
  description: |
    Official OpenAPI 3.0.3 specification for the **Elevate Flower E-Commerce Microservices** platform on the `master` branch.

    ### Available Modules & APIs:
    - **Customer Registration**: Customer account registration (`/identity/users/register`) with Egyptian mobile validation, password rules, and field-mapped duplicate checks.
    - **Authentication & Login**: Unified customer/driver login and refresh (`/identity/auth/login`, `/identity/auth/refresh`) issuing JWT tokens with role claims and driver application status.
    - **Admin Login**: Admin login, refresh and session check (`/identity/admin/login`, `/identity/admin/refresh`, `/identity/admin/session`).
    - **OTP Password Reset**: Password reset flow via email OTP (`/identity/auth/forgot-password`, `/identity/auth/verify-otp`, `/identity/auth/reset-password`).
    - **Profile**: Account profile for every role (`/identity/users/me/profile`) and the driver's vehicle info (`/identity/drivers/me/profile`).
    - **Driver Application Onboarding**: Prospective driver application submission (`/identity/drivers/applications`) with multipart document uploads and status tracking.
    - **Admin Operations**: Security audits, rate-limiting, and driver application review endpoints (`/identity/admin/drivers/applications`).
    - **Server-Driven Home Screen**: Anonymous SDUI layout endpoint (`/catalog/home/layout`) returning ordered backend-defined sections and fetch configuration.
    - **Catalog**: Products, product details, categories and occasions (`/catalog/...`).
    - **Cart**: Customer cart with live price and stock re-validation (`/cart`).
    - **Driver Deliveries**: Assigned orders, status updates and live location (`/orders/drivers/me/...`).
    - **Addresses & Coverage**: Saved addresses, default address, areas lookup and store resolution.

    ### Not on master yet
    - Customer order history (My Orders) lives on the `Development` branch.
    - Checkout and payments are planned and not implemented; the Payment service is still a template.

    ### Response envelopes
    Most endpoints return `OperationResult` (`success`, `statusCode`, `message`, `messageLocalized`, `data`).
    The customer/driver/admin login and refresh endpoints return `ApiResponse` (`isSuccess`, `message`, `data`, `errors`, `statusCode`, `timestamp`).

    ### Seeded test customer accounts:
    - `customer@flower.local` / `CustomerFL@123`
    - `customer2@flower.local` / `CustomerFL@123`
  contact:
    name: Elevate E-Commerce Team
    email: support@flower.local
servers:
  - url: http://localhost:8080/api/v1
    description: API Gateway in Docker (docker compose)
  - url: http://localhost:5086/api/v1
    description: Local API Gateway (HTTP)
  - url: https://localhost:7284/api/v1
    description: Local API Gateway (HTTPS)

tags:
  - name: Users
    description: Customer registration and profile management
  - name: Authentication
    description: User authentication, JWT tokens, and OTP password reset
  - name: Notifications
    description: Customer notification inbox and read state
  - name: Driver Applications
    description: Prospective driver onboarding and document submissions
  - name: Admins
    description: >-
      Admin login, driver review, approvals, rejections, and security audits. Identity admin
      endpoints return 403 for any authorization failure, including a missing token.
  - name: Catalog
    description: Flower catalog, categories, and inventory management
  - name: Home
    description: Server-driven customer home screen layout
  - name: Cart
    description: Customer shopping cart operations
  - name: Orders
    description: Driver deliveries - assigned orders, status updates and live location
  - name: Payments
    description: Payment gateway integration and transaction charges
  - name: Address & Coverage
    description: Address validation and store delivery zone coverage
  - name: Admin Stores
    description: Admin management for stores, branches, and coverage areas

paths:
  /identity/users/register:
    post:
      tags:
        - Users
      summary: Register a customer account
      description: Anonymous minimal API endpoint for customer account registration. Creates Identity account, customer profile, and assigns Role=Customer atomically.
      operationId: RegisterCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCustomerRequest'
      responses:
        '201':
          description: Account registered successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterCustomerOperationResult'
        '422':
          description: Customer registration validation or duplicate field failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResult'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'

  /identity/users/me/profile:
    get:
      tags:
        - Users
      summary: Read the signed-in user's profile
      description: >-
        Returns the caller's own account profile. Open to every authenticated role, since
        customers, drivers and admins all have a name, email, phone, gender and avatar. This is
        the Edit profile screen, which is identical in the customer and driver apps. Vehicle
        details are returned by `/identity/drivers/me/profile`.
      operationId: GetMyProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The caller's profile.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
        '401':
          description: Missing or invalid token.
        '404':
          description: The token belongs to an account that no longer exists.
    put:
      tags:
        - Users
      summary: Update the signed-in user's profile
      description: >-
        Updates name, email, phone, gender and avatar in one call. Email and phone are validated
        for format and uniqueness exactly as in registration, except that the uniqueness check
        skips the caller's own row so re-saving an unchanged email is not reported as a duplicate.

        The email doubles as the username, so changing it also changes the login identity and
        revokes every active refresh token. The response sets `emailChanged` to true in that case
        and the client must sign in again with the new address. Changing anything else leaves the
        session working.

        Omitting `profilePicture` keeps the current avatar; sending a new one replaces it and
        deletes the previous file.

        Fields match the Edit profile screen: `firstName`, `lastName`, `email`, `phoneNumber`,
        `gender`, `profilePicture`. Vehicle details are updated through
        `/identity/drivers/me/profile`. Password changes are not part of this endpoint.
      operationId: UpdateMyProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            encoding:
              profilePicture:
                contentType: image/jpeg, image/png
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
        '400':
          description: >-
            The form could not be read, for example `gender` is not one of the allowed values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '401':
          description: Missing or invalid token.
        '404':
          description: The token belongs to an account that no longer exists.
        '422':
          description: >-
            Validation failed. `data` maps field names to messages, for example
            `{"Email":["Email already registered"]}` when another account already uses it.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties:
                          type: array
                          items:
                            type: string

  /identity/auth/login:
    post:
      tags:
        - Authentication
      summary: User Login (Customer & Driver)
      description: Verifies user credentials. Returns signed JWT access token, refresh token, role, and driver application status.
      operationId: UserLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginResponse'
        '401':
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '429':
          description: Too many login attempts. Rate limited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'

  /identity/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh customer/driver tokens
      description: Exchanges a valid refresh token for a new access token and refresh token. The old refresh token is revoked.
      operationId: RefreshUserToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New tokens issued. Same body as login.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginResponse'
        '401':
          description: Refresh token is invalid, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /identity/admin/login:
    post:
      tags:
        - Admins
      summary: Admin login
      description: >-
        Signs in an admin. Every attempt is audited. After repeated failures the account and IP
        are temporarily blocked; blocked attempts return the same 401 as a wrong password so
        the response does not reveal the block.
      operationId: AdminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '401':
          description: Invalid email or password, the account is not an admin, or attempts are temporarily blocked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /identity/admin/refresh:
    post:
      tags:
        - Admins
      summary: Refresh admin tokens
      description: Exchanges a valid admin refresh token for new tokens.
      operationId: RefreshAdminToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New tokens issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '401':
          description: Refresh token is invalid, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /identity/admin/session:
    get:
      tags:
        - Admins
      summary: Check admin session
      description: Returns 204 when the bearer token belongs to a signed-in admin. Used by the dashboard to validate a stored session.
      operationId: AdminSession
      security:
        - BearerAuth: []
      responses:
        '204':
          description: The token is a valid admin session.
        '403':
          description: >-
            Missing, invalid or non-admin token. Admin endpoints answer every authorization
            failure with 403 (never 401) and record it in the security audit.

  /identity/auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request Password Reset OTP
      description: Generates a 6-digit numeric OTP valid for 10 minutes and dispatches it via email. Always returns a neutral 200 message.
      operationId: ForgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Neutral response confirming code dispatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
        '400':
          description: Invalid email format.

  /identity/auth/verify-otp:
    post:
      tags:
        - Authentication
      summary: Verify Password Reset OTP
      description: Verifies the 6-digit OTP code and issues a password reset authorization token.
      operationId: VerifyResetOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: Reset code verified. Returns password reset token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOtpResponse'
        '400':
          description: Invalid OTP code or validation failure.
        '410':
          description: OTP code expired.
        '423':
          description: Maximum attempts exceeded.

  /identity/auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset Password
      description: Updates the account password using the verified reset token and revokes all active refresh tokens.
      operationId: ResetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '400':
          description: Password policy violation or password mismatch.
        '401':
          description: Invalid or expired password reset authorization.

  /identity/notifications:
    get:
      tags:
        - Notifications
      summary: List my notifications
      description: Returns the current authenticated customer's notifications, newest first, with read state for mobile rendering.
      operationId: ListMyNotifications
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: isRead
          in: query
          required: false
          description: Optional filter for read or unread notifications.
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated notification inbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsOperationResult'
        '401':
          description: Missing or invalid token.
        '403':
          description: Caller is not a Customer.

  /identity/drivers/me/profile:
    get:
      tags:
        - Driver Applications
      summary: Get my vehicle info
      description: >-
        Returns the signed-in driver's Vehicle info screen: vehicle type, vehicle number and the
        current vehicle license. Name, email, phone, gender and photo come from
        `/identity/users/me/profile`, shared with customers.
      operationId: GetMyDriverProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Vehicle info returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfileOperationResult'
        '401':
          description: Missing or invalid token.
        '403':
          description: Caller is not a Driver.
        '404':
          description: Driver profile was not found.
    put:
      tags:
        - Driver Applications
      summary: Update my vehicle info
      description: >-
        Updates the vehicle type and number and, optionally, replaces the vehicle license.
        Omitting `vehicleLicense` keeps the current one. Every license upload is kept with the
        driver's application documents, so admins can still see earlier versions.
      operationId: UpdateMyDriverProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateDriverProfileRequest'
            encoding:
              vehicleLicense:
                contentType: image/jpeg, image/png, application/pdf
      responses:
        '200':
          description: Vehicle info updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfileOperationResult'
        '400':
          description: >-
            The form could not be read, for example `vehicleType` is not one of the allowed values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '401':
          description: Missing or invalid token.
        '403':
          description: Caller is not a Driver.
        '404':
          description: Driver profile or application was not found.
        '422':
          description: >-
            Validation failed. `data` maps field names to messages, for example
            `{"VehicleNumber":["Vehicle number is required."]}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResult'

  /identity/drivers/me/profile/vehicle-license:
    get:
      tags:
        - Driver Applications
      summary: Download my vehicle license
      description: >-
        Streams the signed-in driver's current vehicle license. The file is private, so it is
        only reachable through this authorized endpoint and never through a public link.
      operationId: DownloadMyVehicleLicense
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The license file.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '401':
          description: Missing or invalid token.
        '403':
          description: Caller is not a Driver.
        '404':
          description: No license was uploaded yet.

  /identity/drivers/applications:
    post:
      tags:
        - Driver Applications
      summary: Submit Driver Application
      description: Submits a prospective driver application with vehicle info, national ID, and uploaded license/ID documents (PDF, PNG, JPG max 5MB).
      operationId: SubmitDriverApplication
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmitDriverApplicationRequest'
      responses:
        '201':
          description: Application submitted successfully. Status set to PendingReview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitDriverApplicationOperationResult'
        '400':
          description: Validation error or missing documents.
        '409':
          description: Field-mapped duplicate error (Email, Phone, or National ID already registered).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldConflictResult'

  /identity/admin/drivers/applications:
    get:
      tags:
        - Admins
      summary: List Driver Applications (Admin)
      description: Paginated query of prospective driver applications with optional status filter.
      operationId: ListAdminDriverApplications
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DriverApplicationStatus'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of applications.

  /identity/admin/drivers/applications/{id}:
    get:
      tags:
        - Admins
      summary: Get Driver Application Detail (Admin)
      description: Retrieves complete applicant details, vehicle info, national ID, and document links for review.
      operationId: GetAdminDriverApplicationDetail
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detailed application profile.

  /identity/admin/drivers/applications/{id}/approve:
    post:
      tags:
        - Admins
      summary: Approve Driver Application (Admin)
      description: Approves a pending driver application, allowing driver access.
      operationId: ApproveDriverApplication
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Application approved successfully.

  /identity/admin/drivers/applications/{id}/reject:
    post:
      tags:
        - Admins
      summary: Reject Driver Application (Admin)
      description: Rejects a pending driver application with a mandatory rejection reason.
      operationId: RejectDriverApplication
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rejectionReason
              properties:
                rejectionReason:
                  type: string
                  example: "National ID copy is unreadable."
      responses:
        '200':
          description: Application rejected successfully.

  /identity/admin/drivers/applications/{id}/documents/{documentId}/download:
    get:
      tags:
        - Admins
      summary: Download Driver Document (Admin)
      description: Securely downloads an uploaded driver verification document (PDF, PNG, JPEG). Only accessible to Admin users.
      operationId: DownloadDriverDocument
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document binary stream.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary

  /catalog/products:
    get:
      tags:
        - Catalog
      summary: List Products
      description: Fetch available flowers and arrangements catalog. Supports filtering and search by product name.
      operationId: ListProducts
      security: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: occasionId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: storeId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: inStock
          in: query
          required: false
          schema:
            type: boolean
        - name: search
          in: query
          required: false
          description: Case-insensitive match on product name.
          schema:
            type: string
        - name: sortBy
          in: query
          required: false
          description: "Sorting options: LowestPrice (PriceAsc/PriceLowToHigh), HighestPrice (PriceDesc/PriceHighToLow), BestSeller (BestSelling), Newest (New), Oldest (Old), Discount (DiscountHighToLow)"
          schema:
            type: string
            enum:
              - PriceAsc
              - PriceLowToHigh
              - LowestPrice
              - PriceDesc
              - PriceHighToLow
              - HighestPrice
              - BestSeller
              - BestSelling
              - Newest
              - New
              - Oldest
              - Old
              - Discount
              - DiscountHighToLow
      responses:
        '200':
          description: Catalog items.

  /catalog/products/{id}:
    get:
      tags:
        - Catalog
      summary: Get product details
      description: >-
        Returns one product with images, included items and pricing. Pass `storeId` to get
        stock for that store; without it `requiresStoreSelection` tells the app that a store
        must be chosen before stock is known.
      operationId: GetProductDetails
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: storeId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product details.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProductDetail'
        '404':
          description: No active product with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'

  /catalog/occasions:
    get:
      tags:
        - Catalog
      summary: List occasions
      description: Returns active occasions ordered by `sortOrder`.
      operationId: GetOccasions
      security: []
      responses:
        '200':
          description: Active occasions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Occasion'

  /catalog/categories:
    get:
      tags:
        - Categories
      summary: List active categories
      description: |
        Powers the home category rail and the Categories screen.
        Returns only active categories, ordered by `sortOrder` then name.
        The client renders the "All" entry itself; it is not returned here.
        Filtering, searching, and sorting are applied through `/catalog/products`.
      operationId: GetCategories
      security: []
      responses:
        '200':
          description: Active categories.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CategorySummary'

  /catalog/categories/{categoryId}:
    get:
      tags:
        - Categories
      summary: Get a category by id
      description: |
        Resolves a category deep link.
        An archived category answers `410 Gone` so an existing link can render a
        "no longer available" state instead of failing. `404` means the id never existed.
      operationId: GetCategoryById
      security: []
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The category.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CategorySummary'
        '404':
          description: No category with this id.
        '410':
          description: The category exists but has been archived.

  /catalog/admin/categories:
    get:
      tags:
        - Admin Categories
      summary: List categories for administration
      description: Includes archived categories by default so they can be restored.
      operationId: ListAdminCategories
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Categories with administrative fields.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminCategory'
        '401':
          description: Missing or invalid token.
        '403':
          description: Caller is not an Admin.
    post:
      tags:
        - Admin Categories
      summary: Create a category
      description: A new active category appears on the customer bar immediately.
      operationId: CreateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 120
                  example: "Tulips"
                imageUrl:
                  type: string
                  nullable: true
                  maxLength: 512
                sortOrder:
                  type: integer
                  minimum: 0
                  default: 0
                isActive:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminCategory'
        '409':
          description: A category with this name already exists.
        '422':
          description: Validation failed; `data` maps field names to messages.

  /catalog/admin/categories/{categoryId}:
    put:
      tags:
        - Admin Categories
      summary: Rename or restyle a category
      description: Renaming never changes the archived state; use the archive endpoints for that.
      operationId: UpdateCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 120
                imageUrl:
                  type: string
                  nullable: true
                  maxLength: 512
                sortOrder:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminCategory'
        '404':
          description: No category with this id.
        '409':
          description: Another category already uses this name.
        '422':
          description: Validation failed.

  /catalog/admin/categories/{categoryId}/archive:
    patch:
      tags:
        - Admin Categories
      summary: Archive a category
      description: |
        Hides the category from customers. The row is kept so existing deep links
        answer `410 Gone` rather than `404`.
      operationId: ArchiveCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Archived.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminCategory'
        '404':
          description: No category with this id.
        '409':
          description: Category is already archived.

  /catalog/admin/categories/{categoryId}/restore:
    patch:
      tags:
        - Admin Categories
      summary: Restore an archived category
      operationId: RestoreCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminCategory'
        '404':
          description: No category with this id.
        '409':
          description: Category is already active.

  /catalog/home/layout:
    get:
      tags:
        - Home
      summary: Get server-driven home layout
      description: |
        Returns an ordered backend-defined home screen layout.

        The response contains section descriptors with a common envelope:
        `{ type, id, title, order, enabled, payload }`.

        `payload` is section configuration only. It does not embed products,
        categories, or occasions. The Flutter client should use the section
        `type` and payload filters/links to call the dedicated endpoints such as
        `/catalog/products`, `/catalog/categories`, and `/catalog/occasions`.

        Supported section types:
        - `banner`
        - `category_rail`
        - `product_rail`
        - `occasion_rail`

        `storeId` is optional and reserved for store-aware layout selection.
      operationId: GetHomeLayout
      security: []
      parameters:
        - name: storeId
          in: query
          required: false
          description: Optional resolved store ID used to scope product/banner availability.
          schema:
            type: string
            format: uuid
          example: "00000000-0000-0000-0000-000000000001"
      responses:
        '200':
          description: Ordered list of enabled/disabled server-driven home sections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeLayoutOperationResult'
              examples:
                sample:
                  summary: Sample home layout
                  value:
                    success: true
                    statusCode: 200
                    message: "Success"
                    messageLocalized: "Success"
                    data:
                      - type: banner
                        id: "50000000-0000-0000-0000-000000000001"
                        title: "Summer Picks"
                        order: 1
                        enabled: true
                        payload:
                          bannerId: "30000000-0000-0000-0000-000000000001"
                      - type: category_rail
                        id: "50000000-0000-0000-0000-000000000002"
                        title: "Shop by Category"
                        order: 2
                        enabled: true
                        payload:
                          take: 10
                          deepLink: "/categories"
                      - type: product_rail
                        id: "50000000-0000-0000-0000-000000000003"
                        title: "Best Sellers"
                        order: 3
                        enabled: true
                        payload:
                          selectionRule: "best_sellers"
                          take: 10
                          deepLink: "/products?sort=best_sellers"

  /catalog/home/sections:
    get:
      tags:
        - Home
      summary: Get home sections (alias)
      description: Same handler and response as `/catalog/home/layout`, kept for clients that use the older name.
      operationId: GetHomeSections
      security: []
      parameters:
        - name: storeId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Same body as `/catalog/home/layout`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeLayoutOperationResult'

  /cart:
    get:
      tags:
        - Cart
      summary: Get the current cart
      description: >-
        Returns the caller's cart with live pricing. Each stored line is re-validated against the
        Catalog service, so `priceChanged` and `outOfStock` flag lines that moved since they were
        added and `hasChanges` summarises them for the cart screen banner.
        A customer with no cart yet receives `200` with an empty cart, never `404`.
        If the Catalog service is unreachable the stored snapshot is returned with
        `pricingUnavailable: true` instead of failing.
      operationId: GetCart
      security:
        - BearerAuth: []
      parameters:
        - name: storeId
          in: query
          required: false
          description: Branch used to resolve stock and price. Omit it and stock cannot be evaluated.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The cart, empty or populated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Cart'
        '401':
          description: Missing or invalid token.
        '403':
          description: Caller is not a Customer.

  /cart/items:
    post:
      tags:
        - Cart
      summary: Add an item to the cart
      description: >-
        Adding a product already present increases that line instead of creating a second one,
        and the stock check applies to the resulting total. The cart is created on first use.
      operationId: AddCartItem
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '201':
          description: A new line was created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Cart'
        '200':
          description: An existing line was increased.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Cart'
        '404':
          description: The product does not exist or is inactive.
        '409':
          description: Out of stock, or the requested total exceeds available stock.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StockLimit'
        '422':
          description: Validation failed; `data` maps field names to messages.
        '503':
          description: The Catalog service is unreachable, so price and stock cannot be confirmed.

  /cart/items/{itemId}:
    put:
      tags:
        - Cart
      summary: Set a cart line quantity
      description: >-
        The quantity is absolute, not a delta, so repeated calls from a fast stepper converge
        instead of accumulating. Sending `0` removes the line.
      operationId: UpdateCartItemQuantity
      security:
        - BearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemQuantityRequest'
      responses:
        '200':
          description: The updated cart.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Cart'
        '404':
          description: The cart line was not found.
        '409':
          description: The requested quantity exceeds available stock.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StockLimit'
        '422':
          description: Validation failed; `data` maps field names to messages.
        '503':
          description: The Catalog service is unreachable, so price and stock cannot be confirmed.
    delete:
      tags:
        - Cart
      summary: Remove a cart line
      description: Deletes the line permanently and returns the recalculated cart.
      operationId: RemoveCartItem
      security:
        - BearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: storeId
          in: query
          required: false
          description: Branch used to reprice the remaining lines.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The cart after removal; `isEmpty` is true when nothing is left.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Cart'
        '404':
          description: The cart line was not found.
        '401':
          description: Missing or invalid token.
        '403':
          description: Caller is not a Customer.

  /orders/drivers/me/orders:
    get:
      tags:
        - Orders
      summary: List my assigned orders
      description: >-
        Returns the orders assigned to the signed-in driver, newest first. Also reachable
        without the gateway prefix at `/drivers/me/orders`.
      operationId: GetMyDriverOrders
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Assigned orders.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DriverOrderSummary'
        '401':
          description: Missing or invalid token.
        '403':
          description: Caller is not a Driver.

  /orders/drivers/me/orders/{id}:
    get:
      tags:
        - Orders
      summary: Get an assigned order
      description: >-
        Returns pickup and drop-off details for one order assigned to the signed-in driver.
        Also reachable at `/drivers/me/orders/{id}`.
      operationId: GetDriverOrderDetails
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order details.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DriverOrderDetails'
        '401':
          description: Missing or invalid token.
        '403':
          description: Caller is not a Driver, or the order is assigned to another driver.
        '404':
          description: Order was not found.

  /orders/orders/{id}/status:
    patch:
      tags:
        - Orders
      summary: Update order status (driver)
      description: >-
        Moves an assigned order forward. Allowed transitions: `PickedUp` (2) to
        `OutForDelivery` (3), and `OutForDelivery` (3) to `Delivered` (4). Any other move
        returns 409 with the current order. Also reachable at `/orders/{id}/status`.
      operationId: UpdateDriverOrderStatus
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: Status updated. Returns the order.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DriverOrderDetails'
        '401':
          description: Missing or invalid token.
        '403':
          description: Caller is not a Driver, or the order is assigned to another driver.
        '404':
          description: Order was not found.
        '409':
          description: The transition is not allowed. `data` holds the order in its current state.
        '422':
          description: The status value is not a known order status.

  /orders/drivers/me/location:
    post:
      tags:
        - Orders
      summary: Report my location
      description: >-
        Records the driver's position for live tracking. Accepted only while the order is
        `PickedUp` or `OutForDelivery`. Also reachable at `/drivers/me/location`.
      operationId: ReportDriverLocation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverLocationRequest'
      responses:
        '204':
          description: Location recorded.
        '401':
          description: Missing or invalid token.
        '403':
          description: Caller is not a Driver, or the order is assigned to another driver.
        '404':
          description: Order was not found.
        '409':
          description: The order is not an active delivery.
        '422':
          description: Latitude or longitude is out of range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResult'

  /admin/stores:
    get:
      tags:
        - Admin Stores
      summary: List stores and coverage areas
      description: Admin-only list of stores with coverage definitions. Use `includeInactive=true` to audit deactivated stores and inactive coverage rows.
      operationId: ListAdminStores
      security:
        - BearerAuth: []
      parameters:
        - name: includeInactive
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Store list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/StoreResponse'
        '401':
          description: Missing or invalid token.
        '403':
          description: Caller is not an Admin.
    post:
      tags:
        - Admin Stores
      summary: Create a store with coverage areas
      description: Admin-only creation of a branch/store and explicit city/area coverage definitions with optional bounding boxes for point-in-area checks.
      operationId: CreateAdminStore
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreRequest'
      responses:
        '201':
          description: Store created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StoreResponse'
        '409':
          description: Store name already exists.
        '422':
          description: Validation failed; `data` maps fields to inline errors.

  /admin/stores/coverage-diagnostics:
    get:
      tags:
        - Admin Stores
      summary: Get coverage gaps and overlaps
      description: Admin-only diagnostics. Overlaps are city/area pairs covered by more than one active store. Gaps are known city/area pairs that have no active store coverage after deactivation or edits.
      operationId: GetCoverageDiagnostics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Coverage diagnostics.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CoverageDiagnosticsResponse'

  /admin/stores/{storeId}:
    get:
      tags:
        - Admin Stores
      summary: Get store detail
      operationId: GetAdminStore
      security:
        - BearerAuth: []
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Store detail.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StoreResponse'
        '404':
          description: Store was not found.
    put:
      tags:
        - Admin Stores
      summary: Update store and replace active coverage areas
      description: Admin-only update. Existing coverage rows are marked inactive and new active rows are inserted, so historical gaps/overlaps remain queryable.
      operationId: UpdateAdminStore
      security:
        - BearerAuth: []
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreRequest'
      responses:
        '200':
          description: Store updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StoreResponse'
        '404':
          description: Store was not found.
        '409':
          description: Store name already exists.
        '422':
          description: Validation failed; `data` maps fields to inline errors.
    delete:
      tags:
        - Admin Stores
      summary: Deactivate store
      description: Admin-only deactivation. The store and coverage rows are marked inactive, and saved addresses that depended on the store are flagged with `servingStoreId=null` and `isServiceable=false`.
      operationId: DeactivateAdminStore
      security:
        - BearerAuth: []
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Store deactivated and dependent addresses flagged.
        '404':
          description: Store was not found.
        '409':
          description: Store is already inactive.

  /stores/resolve:
    post:
      tags:
        - Address & Coverage
      summary: Resolve a store for an address or map pin
      description: Resolves by active coverage city/area and optional bounding box point-in-area check. If no coverage matches but lat/lng is supplied, falls back to the nearest active store with coordinates.
      operationId: ResolveStore
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveStoreRequest'
      responses:
        '200':
          description: Store resolution result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ResolveStoreResponse'
        '422':
          description: Validation failed; `data` maps fields to inline errors.
  /users/me/addresses:
    get:
      tags:
        - Address & Coverage
      summary: List my saved addresses
      description: |
        Returns all saved addresses for the authenticated Customer. Results are ordered with the default address first, then by most recently used or created. When the user has no addresses, `data` is an empty array and `message` is `No saved addresses yet.` so the client can show the empty state and Add address CTA.
      operationId: ListMyAddresses
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Saved address list, possibly empty.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AddressListItemResponse'
              examples:
                empty:
                  summary: No saved addresses
                  value:
                    success: true
                    statusCode: 200
                    message: "No saved addresses yet."
                    messageLocalized: "No saved addresses yet."
                    data: []
        '401':
          description: Missing, expired, or invalid JWT.
        '403':
          description: Authenticated user is not in the Customer role.
    post:
      tags:
        - Address & Coverage
      summary: Add my delivery address
      description: |
        Creates a saved delivery address for the authenticated Customer.
        The first address for a user is automatically marked as default.
        Address creation does not fail when coverage cannot be resolved; unresolved addresses are saved with `isServiceable=false` and `servingStoreId=null` so checkout/catalog flows can show the not-serviceable state later.
      operationId: CreateMyAddress
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressRequest'
            examples:
              manual:
                summary: Manual address
                value:
                  recipientName: "Mariam Ahmed"
                  phone: "01001112222"
                  addressLine: "12 Abbas El Akkad Street, building 4"
                  city: "Cairo"
                  area: "Nasr City"
                  label: "Home"
              withPin:
                summary: Address with map pin
                value:
                  recipientName: "Mariam Ahmed"
                  phone: "01001112222"
                  addressLine: "Road 9, near Metro Station"
                  city: "Cairo"
                  area: "Maadi"
                  lat: 29.9602
                  lng: 31.2569
                  label: "Work"
      responses:
        '201':
          description: Address saved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAddressOperationResult'
        '401':
          description: Missing, expired, or invalid JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '403':
          description: Authenticated user is not in the Customer role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '422':
          description: Required field or Egyptian mobile validation failed. `data` maps field names to inline error messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResult'
  /users/me/addresses/{id}:
    get:
      tags:
        - Address & Coverage
      summary: Get one of my delivery addresses
      description: Returns a saved address owned by the signed-in Customer.
      operationId: GetMyAddressDetails
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The address.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AddressResponse'
        '401':
          description: Missing, expired, or invalid JWT.
        '403':
          description: Authenticated user is not in the Customer role.
        '404':
          description: Address does not exist or is not owned by the current user.
    put:
      tags:
        - Address & Coverage
      summary: Update my delivery address
      description: |
        Updates a saved delivery address for the authenticated Customer.
        The serving store is resolved again only when the address line, city, area, or map pin changes.
      operationId: UpdateMyAddress
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAddressRequest'
      responses:
        '200':
          description: Address updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAddressOperationResult'
        '401':
          description: Missing, expired, or invalid JWT.
        '403':
          description: Authenticated user is not in the Customer role.
        '404':
          description: Address does not exist or is not owned by the current user.
        '422':
          description: Required field or Egyptian mobile validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResult'
    delete:
      tags:
        - Address & Coverage
      summary: Delete my delivery address
      description: |
        Deletes a saved delivery address for the authenticated Customer.
        If it is the default and another address remains, the most recently created remaining address becomes default.
      operationId: DeleteMyAddress
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Address deleted successfully.
        '401':
          description: Missing, expired, or invalid JWT.
        '403':
          description: Authenticated user is not in the Customer role.
        '404':
          description: Address does not exist or is not owned by the current user.
  /users/me/addresses/{id}/default:
    patch:
      tags:
        - Address & Coverage
      summary: Make an address my default
      description: Marks the address as default and clears the flag on the Customer's other addresses.
      operationId: SetDefaultAddress
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The address, now default.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AddressResponse'
        '401':
          description: Missing, expired, or invalid JWT.
        '403':
          description: Authenticated user is not in the Customer role.
        '404':
          description: Address does not exist or is not owned by the current user.

  /areas:
    get:
      tags:
        - Address & Coverage
      summary: List areas with their cities
      description: Anonymous lookup used by the address form. Also reachable at `/areas`, `/api/areas` and `/address/api/areas` without the `/api/v1` prefix.
      operationId: GetAreasWithCities
      security: []
      responses:
        '200':
          description: Areas and cities.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AreaWithCities'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Provide JWT Bearer token obtained from `/identity/auth/login`.

  schemas:
    UserProfile:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        firstName:
          type: string
          example: "Mariam"
        lastName:
          type: string
          example: "Ahmed"
        fullName:
          type: string
          description: First and last name joined, for headers such as the Profile screen.
          example: "Mariam Ahmed"
        email:
          type: string
          format: email
          nullable: true
        phoneNumber:
          type: string
          nullable: true
          example: "01010000001"
        gender:
          type: string
          nullable: true
          enum: [Male, Female]
        profilePictureUrl:
          type: string
          nullable: true
          description: Relative URL served as a static file, requiring no token.
          example: "/uploads/avatars/01a06d307d3c7b0aa3d98e465c3e712d.jpg"
        roles:
          type: array
          items:
            type: string
          example: ["Customer"]
        emailChanged:
          type: boolean
          description: >-
            True when this response changed the login email. Refresh tokens were revoked and the
            client must sign in again with the new address. Always false on GET.

    UpdateProfileRequest:
      type: object
      description: Mirrors the Edit profile screen, identical in the customer and driver apps.
      required: [firstName, lastName, email, phoneNumber, gender]
      properties:
        firstName:
          type: string
          maxLength: 100
          example: "Mariam"
        lastName:
          type: string
          maxLength: 100
          example: "Ahmed"
        email:
          type: string
          format: email
          maxLength: 256
        phoneNumber:
          type: string
          pattern: '^01[0125]\d{8}$'
          example: "01010000001"
        gender:
          type: string
          enum: [Male, Female]
        profilePicture:
          type: string
          format: binary
          nullable: true
          description: Optional jpg or png, 5MB maximum. Omit to keep the current avatar.

    DriverProfile:
      type: object
      description: Mirrors the driver app's Vehicle info screen.
      properties:
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
        vehicleNumber:
          type: string
          maxLength: 32
          example: UP16DL0007
        vehicleLicense:
          allOf:
            - $ref: '#/components/schemas/DriverVehicleLicense'
          nullable: true

    DriverVehicleLicense:
      type: object
      description: The license is private; download it through `downloadUrl` with the driver's token.
      properties:
        documentId:
          type: string
          format: uuid
        fileName:
          type: string
          example: license.pdf
        contentType:
          type: string
          example: application/pdf
        uploadedAt:
          type: string
          format: date-time
        downloadUrl:
          type: string
          example: /drivers/me/profile/vehicle-license

    DriverProfileOperationResult:
      allOf:
        - $ref: '#/components/schemas/OperationResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DriverProfile'

    UpdateDriverProfileRequest:
      type: object
      description: Mirrors the Vehicle info screen.
      required: [vehicleType, vehicleNumber]
      properties:
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
        vehicleNumber:
          type: string
          maxLength: 32
          example: UP16DL0007
        vehicleLicense:
          type: string
          format: binary
          nullable: true
          description: Optional jpg, png or pdf, 5MB maximum. Omit to keep the current license.

    Cart:
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CartLine'
        subtotal:
          type: number
          format: double
          description: Sum of every line subtotal, priced live.
          example: 2797.00
        deliveryFee:
          type: number
          format: double
          nullable: true
          description: Always null for now; the delivery fee is owned by Order & Fulfillment.
          example: null
        total:
          type: number
          format: double
          example: 2797.00
        isEmpty:
          type: boolean
          description: True when the customer has no cart yet, or removed the last line.
        hasChanges:
          type: boolean
          description: >-
            True when any line changed price, went out of stock, or holds more units than are
            still available. Drives the "prices updated" indicator on the cart screen.
        pricingUnavailable:
          type: boolean
          description: >-
            True when the Catalog service could not be reached, meaning prices and stock in this
            response come from the snapshot taken when the items were added.

    CartLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Cart line id, used for update and delete.
        productId:
          type: string
          format: uuid
        name:
          type: string
          example: "Classic Red Roses"
        imageUrl:
          type: string
          nullable: true
        unitPrice:
          type: number
          format: double
          description: The live price after any active discount.
          example: 499.00
        quantity:
          type: integer
          minimum: 1
          example: 3
        lineSubtotal:
          type: number
          format: double
          example: 1497.00
        inStock:
          type: boolean
        availableQuantity:
          type: integer
          description: Remaining units at the requested store; the ceiling for the quantity stepper.
          example: 10
        priceChanged:
          type: boolean
          description: True when the live price differs from the price captured when the item was added.
        outOfStock:
          type: boolean

    AddCartItemRequest:
      type: object
      required: [productId, quantity, storeId]
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          example: 2
        storeId:
          type: string
          format: uuid
          description: Required; stock cannot be validated without knowing the fulfilling branch.

    UpdateCartItemQuantityRequest:
      type: object
      required: [quantity, storeId]
      properties:
        quantity:
          type: integer
          minimum: 0
          maximum: 99
          description: Absolute quantity. Send 0 to remove the line.
          example: 4
        storeId:
          type: string
          format: uuid

    StockLimit:
      type: object
      description: Returned with a 409 so the client can clamp its stepper to the real ceiling.
      properties:
        productId:
          type: string
          format: uuid
        requestedQuantity:
          type: integer
          example: 9
        availableQuantity:
          type: integer
          example: 4

    RegisterCustomerRequest:
      type: object
      required:
        - fullName
        - email
        - phoneNumber
        - gender
        - password
        - confirmPassword
      properties:
        fullName:
          type: string
          example: "Mariam Ahmed"
          description: Full name of the customer.
        email:
          type: string
          format: email
          example: "mariam.ahmed@example.com"
          description: Unique case-insensitive email address.
        phoneNumber:
          type: string
          pattern: '^01[0125]\d{8}$'
          example: "01001112222"
          description: Egyptian mobile number format (01[0-2,5]XXXXXXXX, 11 digits).
        gender:
          type: string
          enum:
            - Male
            - Female
          example: "Female"
        password:
          type: string
          format: password
          minLength: 6
          pattern: '^(?=.*[A-Z])(?=.*\d).{6,}$'
          example: "Pass1234"
          description: Minimum 6 characters, at least 1 uppercase letter and 1 digit.
        confirmPassword:
          type: string
          format: password
          example: "Pass1234"
          description: Must exactly match password.

    RegisterCustomerResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          example: "Customer"
        status:
          type: string
          example: "Active"

    RegisterCustomerOperationResult:
      type: object
      properties:
        isSuccess:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 201
        message:
          type: string
          example: "Account registered successfully."
        data:
          $ref: '#/components/schemas/RegisterCustomerResponse'

    StoreCoverageAreaRequest:
      type: object
      required:
        - city
        - area
      properties:
        city:
          type: string
          maxLength: 120
          example: "Cairo"
        area:
          type: string
          maxLength: 120
          example: "Nasr City"
        minLat:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
          example: 30.02
        maxLat:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
          example: 30.09
        minLng:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
          example: 31.30
        maxLng:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
          example: 31.39

    StoreRequest:
      type: object
      required:
        - name
        - location
      properties:
        name:
          type: string
          maxLength: 160
          example: "Nasr City Branch"
        location:
          type: string
          maxLength: 500
          example: "Nasr City, Cairo"
        lat:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
          example: 30.0561
        lng:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
          example: 31.33
        coverageAreas:
          type: array
          items:
            $ref: '#/components/schemas/StoreCoverageAreaRequest'

    StoreCoverageAreaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        city:
          type: string
        area:
          type: string
        minLat:
          type: number
          format: double
          nullable: true
        maxLat:
          type: number
          format: double
          nullable: true
        minLng:
          type: number
          format: double
          nullable: true
        maxLng:
          type: number
          format: double
          nullable: true
        isActive:
          type: boolean

    StoreResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        location:
          type: string
        lat:
          type: number
          format: double
          nullable: true
        lng:
          type: number
          format: double
          nullable: true
        isActive:
          type: boolean
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
          nullable: true
        coverageAreas:
          type: array
          items:
            $ref: '#/components/schemas/StoreCoverageAreaResponse'

    CoverageDiagnosticsResponse:
      type: object
      properties:
        gaps:
          type: array
          items:
            $ref: '#/components/schemas/CoverageGap'
        overlaps:
          type: array
          items:
            $ref: '#/components/schemas/CoverageOverlap'

    CoverageGap:
      type: object
      properties:
        city:
          type: string
        area:
          type: string

    CoverageOverlap:
      type: object
      properties:
        city:
          type: string
        area:
          type: string
        storeIds:
          type: array
          items:
            type: string
            format: uuid

    ResolveStoreRequest:
      type: object
      properties:
        city:
          type: string
          nullable: true
          example: "Cairo"
        area:
          type: string
          nullable: true
          example: "Nasr City"
        lat:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
        lng:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180

    ResolveStoreResponse:
      type: object
      properties:
        storeId:
          type: string
          format: uuid
          nullable: true
        isServiceable:
          type: boolean
        resolutionType:
          type: string
          enum: [CoverageArea, NearestStore, Unresolved]
        matchingStoreIds:
          type: array
          items:
            type: string
            format: uuid
    CreateAddressRequest:
      type: object
      required:
        - recipientName
        - phone
        - addressLine
        - city
        - area
      properties:
        recipientName:
          type: string
          maxLength: 120
          example: "Mariam Ahmed"
        phone:
          type: string
          pattern: '^01[0125]\d{8}$'
          example: "01001112222"
          description: Egyptian mobile number format (01[0-2,5]XXXXXXXX, 11 digits).
        addressLine:
          type: string
          maxLength: 500
          example: "12 Abbas El Akkad Street, building 4"
        city:
          type: string
          maxLength: 120
          example: "Cairo"
        area:
          type: string
          maxLength: 120
          example: "Nasr City"
        lat:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
          example: 30.0561
        lng:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
          example: 31.3300
        label:
          type: string
          nullable: true
          maxLength: 50
          example: "Home"

    UpdateAddressRequest:
      type: object
      required:
        - recipientName
        - phone
        - addressLine
        - city
        - area
      properties:
        recipientName:
          type: string
          maxLength: 120
        phone:
          type: string
          pattern: '^01[0125]\d{8}$'
        addressLine:
          type: string
          maxLength: 500
        city:
          type: string
          maxLength: 120
        area:
          type: string
          maxLength: 120
        lat:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
        lng:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
        label:
          type: string
          nullable: true
          maxLength: 50

    AddressResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        recipientName:
          type: string
        phone:
          type: string
        addressLine:
          type: string
        city:
          type: string
        area:
          type: string
        lat:
          type: number
          format: double
          nullable: true
        lng:
          type: number
          format: double
          nullable: true
        label:
          type: string
          nullable: true
        servingStoreId:
          type: string
          format: uuid
          nullable: true
          description: Resolved serving store. Null means the address was saved but is not currently serviceable.
        isServiceable:
          type: boolean
        isDefault:
          type: boolean
        createdAtUtc:
          type: string
          format: date-time
        lastUsedAtUtc:
          type: string
          format: date-time
          nullable: true

    CreateAddressOperationResult:
      type: object
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 201
        message:
          type: string
          example: "Address created successfully."
        messageLocalized:
          type: string
          example: "Address created successfully."
        data:
          $ref: '#/components/schemas/AddressResponse'

    UpdateAddressOperationResult:
      type: object
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: "Address updated successfully."
        messageLocalized:
          type: string
          example: "Address updated successfully."
        data:
          $ref: '#/components/schemas/AddressResponse'
    UserLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "Pass1234"

    UserLoginResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: "Login successful."
        data:
          type: object
          properties:
            accessToken:
              type: string
              description: JWT access token containing role and optional driver application status claims.
            refreshToken:
              type: string
            expiresIn:
              type: integer
              example: 900
            role:
              type: string
              example: "Customer"
            driverApplicationStatus:
              $ref: '#/components/schemas/DriverApplicationStatus'
              nullable: true
            canAccessDriverHome:
              type: boolean
              example: true
            driverApplicationRejectionReason:
              type: string
              nullable: true
              example: null

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"

    ForgotPasswordResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: "If this email is registered, a code has been sent."
        data:
          type: object
          properties:
            cooldownRemainingSeconds:
              type: integer
              example: 30

    VerifyOtpRequest:
      type: object
      required:
        - email
        - otp
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        otp:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^\d{6}$'
          example: "123456"

    VerifyOtpResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: "Reset code verified."
        data:
          type: object
          properties:
            status:
              type: string
              example: "Valid"
            resetToken:
              type: string
              example: "CfDJ8N..."
            expiresAtUtc:
              type: string
              format: date-time

    ResetPasswordRequest:
      type: object
      required:
        - resetToken
        - newPassword
        - confirmPassword
      properties:
        resetToken:
          type: string
          example: "CfDJ8N..."
        newPassword:
          type: string
          format: password
          minLength: 6
          pattern: '^(?=.*[A-Z])(?=.*\d).{6,}$'
          example: "NewPass123"
        confirmPassword:
          type: string
          format: password
          example: "NewPass123"

    SubmitDriverApplicationRequest:
      type: object
      required:
        - fullName
        - phone
        - email
        - nationalId
        - vehicleType
        - vehiclePlateNumber
        - password
        - confirmPassword
        - documents
      properties:
        fullName:
          type: string
          example: "Ahmed Hassan"
        phone:
          type: string
          example: "+201001112222"
        email:
          type: string
          format: email
          example: "ahmed.driver@flower.local"
        nationalId:
          type: string
          example: "29901011234567"
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
        vehiclePlateNumber:
          type: string
          example: "ABC-1234"
        password:
          type: string
          format: password
          example: "Driver_123!"
        confirmPassword:
          type: string
          format: password
          example: "Driver_123!"
        documents:
          type: array
          items:
            type: string
            format: binary

    SubmitDriverApplicationResponse:
      type: object
      properties:
        applicationId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/DriverApplicationStatus'

    SubmitDriverApplicationOperationResult:
      type: object
      properties:
        isSuccess:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 201
        message:
          type: string
          example: "Driver application submitted successfully."
        data:
          $ref: '#/components/schemas/SubmitDriverApplicationResponse'

    DriverApplicationStatus:
      type: integer
      description: "Serialized as a number: 0 PendingReview, 1 Approved, 2 Rejected."
      enum: [0, 1, 2]

    VehicleType:
      type: string
      description: >-
        Sent and returned by name on the profile endpoints; forms also accept the number.
        The admin driver application endpoints still return it as a number (0 Motorcycle, 1 Car).
      enum:
        - Motorcycle
        - Car

    OrderStatus:
      type: integer
      description: "Serialized as a number: 0 Placed, 1 Preparing, 2 PickedUp, 3 OutForDelivery, 4 Delivered, 5 Cancelled."
      enum: [0, 1, 2, 3, 4, 5]

    GeoPoint:
      type: object
      properties:
        latitude:
          type: number
          format: double
          example: 30.0444
        longitude:
          type: number
          format: double
          example: 31.2357

    DriverOrderSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: string
          example: "FL-10001"
        customerArea:
          type: string
          example: "Nasr City"
        itemCount:
          type: integer
          example: 3
        status:
          $ref: '#/components/schemas/OrderStatus'

    DriverOrderItem:
      type: object
      properties:
        productName:
          type: string
          example: "Red Roses Bouquet"
        quantity:
          type: integer
          example: 2
        unitPrice:
          type: number
          format: double
          example: 450.00

    DriverOrderDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/DriverOrderItem'
        recipientName:
          type: string
        recipientPhone:
          type: string
        storeName:
          type: string
        storeAddress:
          type: string
        pickupLocation:
          $ref: '#/components/schemas/GeoPoint'
        deliveryAddressLine:
          type: string
        deliveryCity:
          type: string
        deliveryArea:
          type: string
        dropOffLocation:
          $ref: '#/components/schemas/GeoPoint'

    UpdateOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
      example:
        status: 3

    DriverLocationRequest:
      type: object
      required: [orderId, latitude, longitude]
      properties:
        orderId:
          type: string
          format: uuid
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 30.0444
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 31.2357

    ProductDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Red Roses Bouquet"
        description:
          type: string
        imageUrls:
          type: array
          items:
            type: string
        includedItems:
          type: array
          items:
            $ref: '#/components/schemas/ProductIncludedItem'
        price:
          type: number
          format: double
          example: 800.00
        discountedPrice:
          type: number
          format: double
          nullable: true
          example: 600.00
        discountPercent:
          type: number
          format: double
          nullable: true
          example: 25
        requiresStoreSelection:
          type: boolean
          description: True when no `storeId` was sent, so stock is unknown until a store is chosen.
        inStock:
          type: boolean
        availableQuantity:
          type: integer

    ProductIncludedItem:
      type: object
      properties:
        name:
          type: string
          example: "Red rose"
        quantity:
          type: integer
          example: 12

    Occasion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Wedding"
        imageUrl:
          type: string
          nullable: true
        sortOrder:
          type: integer
          example: 1

    AddressListItemResponse:
      type: object
      description: Compact address row used by the saved addresses list.
      properties:
        id:
          type: string
          format: uuid
        shortLabel:
          type: string
          example: "Home - Nasr City"
        recipientName:
          type: string
        city:
          type: string
        area:
          type: string
        label:
          type: string
          nullable: true
        isDefault:
          type: boolean
        isServiceable:
          type: boolean
        servingStoreId:
          type: string
          format: uuid
          nullable: true
        createdAtUtc:
          type: string
          format: date-time
        lastUsedAtUtc:
          type: string
          format: date-time
          nullable: true

    AreaWithCities:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Cairo"
        cities:
          type: array
          items:
            $ref: '#/components/schemas/City'

    City:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Nasr City"

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AdminLoginResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                id:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                  format: email
                token:
                  type: string
                  description: JWT access token.
                expiresIn:
                  type: integer
                  description: Access token lifetime in seconds.
                refreshToken:
                  type: string
                refreshTokenExpiration:
                  type: string
                  format: date-time

    ApiResponse:
      type: object
      description: Envelope used by the login and refresh endpoints.
      properties:
        isSuccess:
          type: boolean
        message:
          type: string
        data:
          type: object
          nullable: true
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                example: "User.InvalidCredentials"
              description:
                type: string
                example: "Invalid email or password."
              statusCode:
                type: integer
                example: 401
        statusCode:
          type: integer
        timestamp:
          type: string
          format: date-time

    HomeSection:
      type: object
      required:
        - type
        - id
        - order
        - enabled
      properties:
        type:
          type: string
          description: Section renderer key. Unknown types should be skipped by the client.
          enum:
            - banner
            - category_rail
            - product_rail
            - occasion_rail
          example: "product_rail"
        id:
          type: string
          format: uuid
          example: "50000000-0000-0000-0000-000000000003"
        title:
          type: string
          nullable: true
          example: "Best Sellers"
        order:
          type: integer
          example: 3
        enabled:
          type: boolean
          example: true
        payload:
          nullable: true
          type: object
          additionalProperties: true
          description: Section configuration used by the client to call the dedicated data endpoint. It does not contain rendered rail items.

    HomeLayoutOperationResult:
      type: object
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: "Success"
        messageLocalized:
          type: string
          example: "Success"
        data:
          type: array
          items:
            $ref: '#/components/schemas/HomeSection'

    BannerPayload:
      type: object
      required:
        - imageUrl
        - deepLink
      properties:
        imageUrl:
          type: string
          example: "/images/banners/home-hero.jpg"
        deepLink:
          type: string
          example: "/products?collection=summer"

    CategoryRailPayload:
      type: object
      required:
        - items
        - viewAll
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CategorySummary'
        viewAll:
          $ref: '#/components/schemas/ViewAllAction'

    ProductRailPayload:
      type: object
      required:
        - items
        - viewAll
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        viewAll:
          $ref: '#/components/schemas/ViewAllAction'

    OccasionRailPayload:
      type: object
      required:
        - items
        - viewAll
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OccasionSummary'
        viewAll:
          $ref: '#/components/schemas/ViewAllAction'

    NotificationListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: "New offer"
        body:
          type: string
          example: "Fresh bouquets are available today with a limited discount."
        type:
          type: string
          example: "offer"
        deepLink:
          type: string
          nullable: true
          example: "/catalog/products?sortBy=Discount"
        isRead:
          type: boolean
          example: false
        createdAtUtc:
          type: string
          format: date-time
        readAtUtc:
          type: string
          format: date-time
          nullable: true

    NotificationsPage:
      type: object
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        totalCount:
          type: integer
          example: 3
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationListItem'

    NotificationsOperationResult:
      allOf:
        - $ref: '#/components/schemas/OperationResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/NotificationsPage'
    CategorySummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Birthday Flowers"
        imageUrl:
          type: string
          nullable: true
        deepLink:
          type: string
          example: "/categories/10000000-0000-0000-0000-000000000001"

    AdminCategory:
      type: object
      description: Category as seen by an administrator, including archived ones.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Birthday Flowers"
        imageUrl:
          type: string
          nullable: true
        sortOrder:
          type: integer
          example: 1
        isActive:
          type: boolean
          description: false means archived; hidden from customers but deep links answer 410.
          example: true

    ProductSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Classic Red Roses"
        imageUrl:
          type: string
          nullable: true
        price:
          type: number
          format: decimal
          example: 499
        categoryId:
          type: string
          format: uuid
          nullable: true
        occasionId:
          type: string
          format: uuid
          nullable: true
        deepLink:
          type: string
          example: "/products/40000000-0000-0000-0000-000000000001"

    OccasionSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Wedding"
        imageUrl:
          type: string
          nullable: true
        deepLink:
          type: string
          example: "/occasions/20000000-0000-0000-0000-000000000001"

    ViewAllAction:
      type: object
      required:
        - label
        - deepLink
      properties:
        label:
          type: string
          example: "View All"
        deepLink:
          type: string
          example: "/products?sort=best_sellers"

    FieldConflictResult:
      type: object
      properties:
        isSuccess:
          type: boolean
          example: false
        statusCode:
          type: integer
          example: 409
        message:
          type: string
          example: "Email already registered"
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    ValidationErrorResult:
      type: object
      description: A 422 `OperationResult` whose `data` maps each field to its error messages.
      properties:
        success:
          type: boolean
          example: false
        statusCode:
          type: integer
          example: 422
        message:
          type: string
          example: "Customer registration validation failed."
        messageLocalized:
          type: string
        data:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            Email: ["Email already registered"]
            PhoneNumber: ["Phone number already registered"]

    OperationResult:
      type: object
      description: >-
        Standard envelope used by most endpoints. `success` is true for any 2xx `statusCode`.
        Endpoints that return a payload put it in `data`.
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        message:
          type: string
        messageLocalized:
          type: string
        data:
          nullable: true
          description: Endpoint-specific payload; see each endpoint's schema.

