openapi: 3.0.3
info:
  title: Elevate Flower E-Commerce Microservices API
  version: 1.0.0
  description: |
    Official OpenAPI 3.0.3 specification for the **Elevate Flower E-Commerce Microservices** platform on `Development` branch.
    
    ### Available Modules & APIs:
    - **Customer Registration**: Customer account registration (`/identity/users/register`) with Egyptian mobile validation, password rules, and field-mapped duplicate checks.
    - **Authentication & Login**: Unified customer/driver login (`/identity/auth/login`) issuing JWT tokens with role claims and driver application status.
    - **OTP Password Reset**: Password reset flow via email OTP (`/identity/auth/forgot-password`, `/identity/auth/verify-otp`, `/identity/auth/reset-password`).
    - **Driver Application Onboarding**: Prospective driver application submission (`/identity/drivers/applications`) with multipart document uploads and status tracking.
    - **Admin Operations**: Security audits, rate-limiting, and driver application review endpoints (`/identity/admin/drivers/applications`).
    - **Server-Driven Home Screen**: Anonymous SDUI layout endpoint (`/catalog/home/layout`) returning ordered backend-defined sections and fetch configuration.
    - **E-Commerce Microservices**: Product Catalog, Shopping Cart, Orders & Fulfillment, Payment Processing, and Store Address Coverage.

    ### Seeded test customer accounts:
    - `customer@flower.local` / `CustomerFL@123`
    - `customer2@flower.local` / `CustomerFL@123`
  contact:
    name: Elevate E-Commerce Team
    email: support@flower.local
servers:
  - url: http://localhost:5086/api/v1
    description: Local API Gateway (HTTP)
  - url: https://localhost:7284/api/v1
    description: Local API Gateway (HTTPS)

tags:
  - name: Users
    description: Customer registration and profile management
  - name: Authentication
    description: User authentication, JWT tokens, and OTP password reset
  - name: Driver Applications
    description: Prospective driver onboarding and document submissions
  - name: Admins
    description: Admin driver review, approvals, rejections, and security audits
  - name: Catalog
    description: Flower catalog, categories, and inventory management
  - name: Home
    description: Server-driven customer home screen layout
  - name: Cart
    description: Customer shopping cart operations
  - name: Orders
    description: Order placement, tracking, and fulfillment
  - name: Payments
    description: Payment gateway integration and transaction charges
  - name: Address & Coverage
    description: Address validation and store delivery zone coverage
  - name: Admin Stores
    description: Admin management for stores, branches, and coverage areas

paths:
  /identity/users/register:
    post:
      tags:
        - Users
      summary: Register a customer account
      description: Anonymous minimal API endpoint for customer account registration. Creates Identity account, customer profile, and assigns Role=Customer atomically.
      operationId: RegisterCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCustomerRequest'
      responses:
        '201':
          description: Account registered successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterCustomerOperationResult'
        '422':
          description: Customer registration validation or duplicate field failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResult'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'

  /identity/auth/login:
    post:
      tags:
        - Authentication
      summary: User Login (Customer & Driver)
      description: Verifies user credentials. Returns signed JWT access token, refresh token, role, and driver application status.
      operationId: UserLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginResponse'
        '401':
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '429':
          description: Too many login attempts. Rate limited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'

  /identity/auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request Password Reset OTP
      description: Generates a 6-digit numeric OTP valid for 10 minutes and dispatches it via email. Always returns a neutral 200 message.
      operationId: ForgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Neutral response confirming code dispatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
        '400':
          description: Invalid email format.

  /identity/auth/verify-otp:
    post:
      tags:
        - Authentication
      summary: Verify Password Reset OTP
      description: Verifies the 6-digit OTP code and issues a password reset authorization token.
      operationId: VerifyResetOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: Reset code verified. Returns password reset token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOtpResponse'
        '400':
          description: Invalid OTP code or validation failure.
        '410':
          description: OTP code expired.
        '423':
          description: Maximum attempts exceeded.

  /identity/auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset Password
      description: Updates the account password using the verified reset token and revokes all active refresh tokens.
      operationId: ResetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '400':
          description: Password policy violation or password mismatch.
        '401':
          description: Invalid or expired password reset authorization.

  /identity/drivers/applications:
    post:
      tags:
        - Driver Applications
      summary: Submit Driver Application
      description: Submits a prospective driver application with vehicle info, national ID, and uploaded license/ID documents (PDF, PNG, JPG max 5MB).
      operationId: SubmitDriverApplication
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmitDriverApplicationRequest'
      responses:
        '201':
          description: Application submitted successfully. Status set to PendingReview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitDriverApplicationOperationResult'
        '400':
          description: Validation error or missing documents.
        '409':
          description: Field-mapped duplicate error (Email, Phone, or National ID already registered).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldConflictResult'

  /identity/admin/drivers/applications:
    get:
      tags:
        - Admins
      summary: List Driver Applications (Admin)
      description: Paginated query of prospective driver applications with optional status filter.
      operationId: ListAdminDriverApplications
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DriverApplicationStatus'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of applications.

  /identity/admin/drivers/applications/{id}:
    get:
      tags:
        - Admins
      summary: Get Driver Application Detail (Admin)
      description: Retrieves complete applicant details, vehicle info, national ID, and document links for review.
      operationId: GetAdminDriverApplicationDetail
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detailed application profile.

  /identity/admin/drivers/applications/{id}/approve:
    post:
      tags:
        - Admins
      summary: Approve Driver Application (Admin)
      description: Approves a pending driver application, allowing driver access.
      operationId: ApproveDriverApplication
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Application approved successfully.

  /identity/admin/drivers/applications/{id}/reject:
    post:
      tags:
        - Admins
      summary: Reject Driver Application (Admin)
      description: Rejects a pending driver application with a mandatory rejection reason.
      operationId: RejectDriverApplication
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rejectionReason
              properties:
                rejectionReason:
                  type: string
                  example: "National ID copy is unreadable."
      responses:
        '200':
          description: Application rejected successfully.

  /identity/admin/drivers/applications/{id}/documents/{documentId}/download:
    get:
      tags:
        - Admins
      summary: Download Driver Document (Admin)
      description: Securely downloads an uploaded driver verification document (PDF, PNG, JPEG). Only accessible to Admin users.
      operationId: DownloadDriverDocument
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document binary stream.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary

  /catalog/products:
    get:
      tags:
        - Catalog
      summary: List Products
      description: Fetch available flowers and arrangements catalog. Supports filtering and search by product name.
      operationId: ListProducts
      security: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: occasionId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: storeId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: inStock
          in: query
          required: false
          schema:
            type: boolean
        - name: search
          in: query
          required: false
          description: Case-insensitive match on product name.
          schema:
            type: string
      responses:
        '200':
          description: Catalog items.

  /catalog/categories:
    get:
      tags:
        - Categories
      summary: List active categories
      description: |
        Powers the home category rail and the Categories screen.
        Returns only active categories, ordered by `sortOrder` then name.
        The client renders the "All" entry itself; it is not returned here.
      operationId: GetCategories
      security: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive match on the category name.
      responses:
        '200':
          description: Active categories.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CategorySummary'

  /catalog/categories/{categoryId}:
    get:
      tags:
        - Categories
      summary: Get a category by id
      description: |
        Resolves a category deep link.
        An archived category answers `410 Gone` so an existing link can render a
        "no longer available" state instead of failing. `404` means the id never existed.
      operationId: GetCategoryById
      security: []
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The category.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CategorySummary'
        '404':
          description: No category with this id.
        '410':
          description: The category exists but has been archived.

  /catalog/admin/categories:
    get:
      tags:
        - Admin Categories
      summary: List categories for administration
      description: Includes archived categories by default so they can be restored.
      operationId: ListAdminCategories
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Categories with administrative fields.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminCategory'
        '401':
          description: Missing or invalid token.
        '403':
          description: Caller is not an Admin.
    post:
      tags:
        - Admin Categories
      summary: Create a category
      description: A new active category appears on the customer bar immediately.
      operationId: CreateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 120
                  example: "Tulips"
                imageUrl:
                  type: string
                  nullable: true
                  maxLength: 512
                sortOrder:
                  type: integer
                  minimum: 0
                  default: 0
                isActive:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminCategory'
        '409':
          description: A category with this name already exists.
        '422':
          description: Validation failed; `data` maps field names to messages.

  /catalog/admin/categories/{categoryId}:
    put:
      tags:
        - Admin Categories
      summary: Rename or restyle a category
      description: Renaming never changes the archived state; use the archive endpoints for that.
      operationId: UpdateCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 120
                imageUrl:
                  type: string
                  nullable: true
                  maxLength: 512
                sortOrder:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminCategory'
        '404':
          description: No category with this id.
        '409':
          description: Another category already uses this name.
        '422':
          description: Validation failed.

  /catalog/admin/categories/{categoryId}/archive:
    patch:
      tags:
        - Admin Categories
      summary: Archive a category
      description: |
        Hides the category from customers. The row is kept so existing deep links
        answer `410 Gone` rather than `404`.
      operationId: ArchiveCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Archived.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminCategory'
        '404':
          description: No category with this id.
        '409':
          description: Category is already archived.

  /catalog/admin/categories/{categoryId}/restore:
    patch:
      tags:
        - Admin Categories
      summary: Restore an archived category
      operationId: RestoreCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminCategory'
        '404':
          description: No category with this id.
        '409':
          description: Category is already active.

  /catalog/home/layout:
    get:
      tags:
        - Home
      summary: Get server-driven home layout
      description: |
        Returns an ordered backend-defined home screen layout.

        The response contains section descriptors with a common envelope:
        `{ type, id, title, order, enabled, payload }`.

        `payload` is section configuration only. It does not embed products,
        categories, or occasions. The Flutter client should use the section
        `type` and payload filters/links to call the dedicated endpoints such as
        `/catalog/products`, `/catalog/categories`, and `/catalog/occasions`.

        Supported section types:
        - `banner`
        - `category_rail`
        - `product_rail`
        - `occasion_rail`

        `storeId` is optional and reserved for store-aware layout selection.
      operationId: GetHomeLayout
      security: []
      parameters:
        - name: storeId
          in: query
          required: false
          description: Optional resolved store ID used to scope product/banner availability.
          schema:
            type: string
            format: uuid
          example: "00000000-0000-0000-0000-000000000001"
      responses:
        '200':
          description: Ordered list of enabled/disabled server-driven home sections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeLayoutOperationResult'
              examples:
                sample:
                  summary: Sample home layout
                  value:
                    success: true
                    statusCode: 200
                    message: "Success"
                    messageLocalized: "Success"
                    data:
                      - type: banner
                        id: "50000000-0000-0000-0000-000000000001"
                        title: "Summer Picks"
                        order: 1
                        enabled: true
                        payload:
                          bannerId: "30000000-0000-0000-0000-000000000001"
                      - type: category_rail
                        id: "50000000-0000-0000-0000-000000000002"
                        title: "Shop by Category"
                        order: 2
                        enabled: true
                        payload:
                          take: 10
                          deepLink: "/categories"
                      - type: product_rail
                        id: "50000000-0000-0000-0000-000000000003"
                        title: "Best Sellers"
                        order: 3
                        enabled: true
                        payload:
                          selectionRule: "best_sellers"
                          take: 10
                          deepLink: "/products?sort=best_sellers"

  /cart:
    get:
      tags:
        - Cart
      summary: Get User Cart
      description: Retrieve current user active shopping cart.
      operationId: GetCart
      responses:
        '200':
          description: User cart items.

  /orders:
    post:
      tags:
        - Orders
      summary: Place Order
      description: Submits a new flower order for fulfillment.
      operationId: PlaceOrder
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Order placed successfully.

  /payments/charge:
    post:
      tags:
        - Payments
      summary: Process Payment
      description: Charges payment for an active order.
      operationId: ProcessPayment
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Payment successful.

  /admin/stores:
    get:
      tags:
        - Admin Stores
      summary: List stores and coverage areas
      description: Admin-only list of stores with coverage definitions. Use `includeInactive=true` to audit deactivated stores and inactive coverage rows.
      operationId: ListAdminStores
      security:
        - BearerAuth: []
      parameters:
        - name: includeInactive
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Store list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/StoreResponse'
        '401':
          description: Missing or invalid token.
        '403':
          description: Caller is not an Admin.
    post:
      tags:
        - Admin Stores
      summary: Create a store with coverage areas
      description: Admin-only creation of a branch/store and explicit city/area coverage definitions with optional bounding boxes for point-in-area checks.
      operationId: CreateAdminStore
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreRequest'
      responses:
        '201':
          description: Store created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StoreResponse'
        '409':
          description: Store name already exists.
        '422':
          description: Validation failed; `data` maps fields to inline errors.

  /admin/stores/coverage-diagnostics:
    get:
      tags:
        - Admin Stores
      summary: Get coverage gaps and overlaps
      description: Admin-only diagnostics. Overlaps are city/area pairs covered by more than one active store. Gaps are known city/area pairs that have no active store coverage after deactivation or edits.
      operationId: GetCoverageDiagnostics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Coverage diagnostics.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CoverageDiagnosticsResponse'

  /admin/stores/{storeId}:
    get:
      tags:
        - Admin Stores
      summary: Get store detail
      operationId: GetAdminStore
      security:
        - BearerAuth: []
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Store detail.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StoreResponse'
        '404':
          description: Store was not found.
    put:
      tags:
        - Admin Stores
      summary: Update store and replace active coverage areas
      description: Admin-only update. Existing coverage rows are marked inactive and new active rows are inserted, so historical gaps/overlaps remain queryable.
      operationId: UpdateAdminStore
      security:
        - BearerAuth: []
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreRequest'
      responses:
        '200':
          description: Store updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StoreResponse'
        '404':
          description: Store was not found.
        '409':
          description: Store name already exists.
        '422':
          description: Validation failed; `data` maps fields to inline errors.
    delete:
      tags:
        - Admin Stores
      summary: Deactivate store
      description: Admin-only deactivation. The store and coverage rows are marked inactive, and saved addresses that depended on the store are flagged with `servingStoreId=null` and `isServiceable=false`.
      operationId: DeactivateAdminStore
      security:
        - BearerAuth: []
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Store deactivated and dependent addresses flagged.
        '404':
          description: Store was not found.
        '409':
          description: Store is already inactive.

  /stores/resolve:
    post:
      tags:
        - Address & Coverage
      summary: Resolve a store for an address or map pin
      description: Resolves by active coverage city/area and optional bounding box point-in-area check. If no coverage matches but lat/lng is supplied, falls back to the nearest active store with coordinates.
      operationId: ResolveStore
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveStoreRequest'
      responses:
        '200':
          description: Store resolution result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ResolveStoreResponse'
        '422':
          description: Validation failed; `data` maps fields to inline errors.
  /users/me/addresses:
    get:
      tags:
        - Address & Coverage
      summary: List my saved addresses
      description: |
        Returns all saved addresses for the authenticated Customer. Results are ordered with the default address first, then by most recently used or created. When the user has no addresses, `data` is an empty array and `message` is `No saved addresses yet.` so the client can show the empty state and Add address CTA.
      operationId: ListMyAddresses
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Saved address list, possibly empty.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AddressListItemResponse'
              examples:
                empty:
                  summary: No saved addresses
                  value:
                    success: true
                    statusCode: 200
                    message: "No saved addresses yet."
                    messageLocalized: "No saved addresses yet."
                    data: []
        '401':
          description: Missing, expired, or invalid JWT.
        '403':
          description: Authenticated user is not in the Customer role.
    post:
      tags:
        - Address & Coverage
      summary: Add my delivery address
      description: |
        Creates a saved delivery address for the authenticated Customer.
        The first address for a user is automatically marked as default.
        Address creation does not fail when coverage cannot be resolved; unresolved addresses are saved with `isServiceable=false` and `servingStoreId=null` so checkout/catalog flows can show the not-serviceable state later.
      operationId: CreateMyAddress
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressRequest'
            examples:
              manual:
                summary: Manual address
                value:
                  recipientName: "Mariam Ahmed"
                  phone: "01001112222"
                  addressLine: "12 Abbas El Akkad Street, building 4"
                  city: "Cairo"
                  area: "Nasr City"
                  label: "Home"
              withPin:
                summary: Address with map pin
                value:
                  recipientName: "Mariam Ahmed"
                  phone: "01001112222"
                  addressLine: "Road 9, near Metro Station"
                  city: "Cairo"
                  area: "Maadi"
                  lat: 29.9602
                  lng: 31.2569
                  label: "Work"
      responses:
        '201':
          description: Address saved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAddressOperationResult'
        '401':
          description: Missing, expired, or invalid JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '403':
          description: Authenticated user is not in the Customer role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '422':
          description: Required field or Egyptian mobile validation failed. `data` maps field names to inline error messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResult'
  /users/me/addresses/{addressId}:
    get:
      tags:
        - Address & Coverage
      summary: Get my saved address details
      description: Returns full details for one saved address owned by the authenticated Customer.
      operationId: GetMyAddressDetails
      security:
        - BearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Address details.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OperationResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AddressResponse'
        '401':
          description: Missing, expired, or invalid JWT.
        '403':
          description: Authenticated user is not in the Customer role.
        '404':
          description: Address was not found for this user.
  /address-store-coverage/check:
    get:
      tags:
        - Address & Coverage
      summary: Check Delivery Coverage
      description: Validates whether a delivery address is within store coverage zones.
      operationId: CheckCoverage
      responses:
        '200':
          description: Coverage result.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Provide JWT Bearer token obtained from `/identity/auth/login`.

  schemas:
    RegisterCustomerRequest:
      type: object
      required:
        - fullName
        - email
        - phoneNumber
        - gender
        - password
        - confirmPassword
      properties:
        fullName:
          type: string
          example: "Mariam Ahmed"
          description: Full name of the customer.
        email:
          type: string
          format: email
          example: "mariam.ahmed@example.com"
          description: Unique case-insensitive email address.
        phoneNumber:
          type: string
          pattern: '^01[0125]\d{8}$'
          example: "01001112222"
          description: Egyptian mobile number format (01[0-2,5]XXXXXXXX, 11 digits).
        gender:
          type: string
          enum:
            - Male
            - Female
          example: "Female"
        password:
          type: string
          format: password
          minLength: 6
          pattern: '^(?=.*[A-Z])(?=.*\d).{6,}$'
          example: "Pass1234"
          description: Minimum 6 characters, at least 1 uppercase letter and 1 digit.
        confirmPassword:
          type: string
          format: password
          example: "Pass1234"
          description: Must exactly match password.

    RegisterCustomerResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          example: "Customer"
        status:
          type: string
          example: "Active"

    RegisterCustomerOperationResult:
      type: object
      properties:
        isSuccess:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 201
        message:
          type: string
          example: "Account registered successfully."
        data:
          $ref: '#/components/schemas/RegisterCustomerResponse'

    StoreCoverageAreaRequest:
      type: object
      required:
        - city
        - area
      properties:
        city:
          type: string
          maxLength: 120
          example: "Cairo"
        area:
          type: string
          maxLength: 120
          example: "Nasr City"
        minLat:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
          example: 30.02
        maxLat:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
          example: 30.09
        minLng:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
          example: 31.30
        maxLng:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
          example: 31.39

    StoreRequest:
      type: object
      required:
        - name
        - location
      properties:
        name:
          type: string
          maxLength: 160
          example: "Nasr City Branch"
        location:
          type: string
          maxLength: 500
          example: "Nasr City, Cairo"
        lat:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
          example: 30.0561
        lng:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
          example: 31.33
        coverageAreas:
          type: array
          items:
            $ref: '#/components/schemas/StoreCoverageAreaRequest'

    StoreCoverageAreaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        city:
          type: string
        area:
          type: string
        minLat:
          type: number
          format: double
          nullable: true
        maxLat:
          type: number
          format: double
          nullable: true
        minLng:
          type: number
          format: double
          nullable: true
        maxLng:
          type: number
          format: double
          nullable: true
        isActive:
          type: boolean

    StoreResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        location:
          type: string
        lat:
          type: number
          format: double
          nullable: true
        lng:
          type: number
          format: double
          nullable: true
        isActive:
          type: boolean
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
          nullable: true
        coverageAreas:
          type: array
          items:
            $ref: '#/components/schemas/StoreCoverageAreaResponse'

    CoverageDiagnosticsResponse:
      type: object
      properties:
        gaps:
          type: array
          items:
            $ref: '#/components/schemas/CoverageGap'
        overlaps:
          type: array
          items:
            $ref: '#/components/schemas/CoverageOverlap'

    CoverageGap:
      type: object
      properties:
        city:
          type: string
        area:
          type: string

    CoverageOverlap:
      type: object
      properties:
        city:
          type: string
        area:
          type: string
        storeIds:
          type: array
          items:
            type: string
            format: uuid

    ResolveStoreRequest:
      type: object
      properties:
        city:
          type: string
          nullable: true
          example: "Cairo"
        area:
          type: string
          nullable: true
          example: "Nasr City"
        lat:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
        lng:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180

    ResolveStoreResponse:
      type: object
      properties:
        storeId:
          type: string
          format: uuid
          nullable: true
        isServiceable:
          type: boolean
        resolutionType:
          type: string
          enum: [CoverageArea, NearestStore, Unresolved]
        matchingStoreIds:
          type: array
          items:
            type: string
            format: uuid
    CreateAddressRequest:
      type: object
      required:
        - recipientName
        - phone
        - addressLine
        - city
        - area
      properties:
        recipientName:
          type: string
          maxLength: 120
          example: "Mariam Ahmed"
        phone:
          type: string
          pattern: '^01[0125]\d{8}$'
          example: "01001112222"
          description: Egyptian mobile number format (01[0-2,5]XXXXXXXX, 11 digits).
        addressLine:
          type: string
          maxLength: 500
          example: "12 Abbas El Akkad Street, building 4"
        city:
          type: string
          maxLength: 120
          example: "Cairo"
        area:
          type: string
          maxLength: 120
          example: "Nasr City"
        lat:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
          example: 30.0561
        lng:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
          example: 31.3300
        label:
          type: string
          nullable: true
          maxLength: 50
          example: "Home"

    AddressListItemResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        shortLabel:
          type: string
          example: "Mariam Ahmed - Cairo/Nasr City"
          description: Compact display label for address selection.
        recipientName:
          type: string
        city:
          type: string
        area:
          type: string
        label:
          type: string
          nullable: true
          example: "Home"
        isDefault:
          type: boolean
        isServiceable:
          type: boolean
        servingStoreId:
          type: string
          format: uuid
          nullable: true
        createdAtUtc:
          type: string
          format: date-time
        lastUsedAtUtc:
          type: string
          format: date-time
          nullable: true
    AddressResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        recipientName:
          type: string
        phone:
          type: string
        addressLine:
          type: string
        city:
          type: string
        area:
          type: string
        lat:
          type: number
          format: double
          nullable: true
        lng:
          type: number
          format: double
          nullable: true
        label:
          type: string
          nullable: true
        servingStoreId:
          type: string
          format: uuid
          nullable: true
          description: Resolved serving store. Null means the address was saved but is not currently serviceable.
        isServiceable:
          type: boolean
        isDefault:
          type: boolean
        createdAtUtc:
          type: string
          format: date-time
        lastUsedAtUtc:
          type: string
          format: date-time
          nullable: true

    CreateAddressOperationResult:
      type: object
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 201
        message:
          type: string
          example: "Address created successfully."
        messageLocalized:
          type: string
          example: "Address created successfully."
        data:
          $ref: '#/components/schemas/AddressResponse'
    UserLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "Pass1234"

    UserLoginResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: "Login successful."
        data:
          type: object
          properties:
            accessToken:
              type: string
              description: JWT access token containing role and optional driver application status claims.
            refreshToken:
              type: string
            expiresIn:
              type: integer
              example: 900
            role:
              type: string
              example: "Customer"
            driverApplicationStatus:
              $ref: '#/components/schemas/DriverApplicationStatus'
              nullable: true
            canAccessDriverHome:
              type: boolean
              example: true
            driverApplicationRejectionReason:
              type: string
              nullable: true
              example: null

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"

    ForgotPasswordResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: "If this email is registered, a code has been sent."
        data:
          type: object
          properties:
            cooldownRemainingSeconds:
              type: integer
              example: 30

    VerifyOtpRequest:
      type: object
      required:
        - email
        - otp
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        otp:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^\d{6}$'
          example: "123456"

    VerifyOtpResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: "Reset code verified."
        data:
          type: object
          properties:
            status:
              type: string
              example: "Valid"
            resetToken:
              type: string
              example: "CfDJ8N..."
            expiresAtUtc:
              type: string
              format: date-time

    ResetPasswordRequest:
      type: object
      required:
        - resetToken
        - newPassword
        - confirmPassword
      properties:
        resetToken:
          type: string
          example: "CfDJ8N..."
        newPassword:
          type: string
          format: password
          minLength: 6
          pattern: '^(?=.*[A-Z])(?=.*\d).{6,}$'
          example: "NewPass123"
        confirmPassword:
          type: string
          format: password
          example: "NewPass123"

    SubmitDriverApplicationRequest:
      type: object
      required:
        - fullName
        - phone
        - email
        - nationalId
        - vehicleType
        - vehiclePlateNumber
        - password
        - confirmPassword
        - documents
      properties:
        fullName:
          type: string
          example: "Ahmed Hassan"
        phone:
          type: string
          example: "+201001112222"
        email:
          type: string
          format: email
          example: "ahmed.driver@flower.local"
        nationalId:
          type: string
          example: "29901011234567"
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
        vehiclePlateNumber:
          type: string
          example: "ABC-1234"
        password:
          type: string
          format: password
          example: "Driver_123!"
        confirmPassword:
          type: string
          format: password
          example: "Driver_123!"
        documents:
          type: array
          items:
            type: string
            format: binary

    SubmitDriverApplicationResponse:
      type: object
      properties:
        applicationId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/DriverApplicationStatus'

    SubmitDriverApplicationOperationResult:
      type: object
      properties:
        isSuccess:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 201
        message:
          type: string
          example: "Driver application submitted successfully."
        data:
          $ref: '#/components/schemas/SubmitDriverApplicationResponse'

    DriverApplicationStatus:
      type: string
      enum:
        - PendingReview
        - Approved
        - Rejected

    VehicleType:
      type: string
      enum:
        - Motorcycle
        - Car
        - Van

    HomeSection:
      type: object
      required:
        - type
        - id
        - order
        - enabled
      properties:
        type:
          type: string
          description: Section renderer key. Unknown types should be skipped by the client.
          enum:
            - banner
            - category_rail
            - product_rail
            - occasion_rail
          example: "product_rail"
        id:
          type: string
          format: uuid
          example: "50000000-0000-0000-0000-000000000003"
        title:
          type: string
          nullable: true
          example: "Best Sellers"
        order:
          type: integer
          example: 3
        enabled:
          type: boolean
          example: true
        payload:
          nullable: true
          type: object
          additionalProperties: true
          description: Section configuration used by the client to call the dedicated data endpoint. It does not contain rendered rail items.

    HomeLayoutOperationResult:
      type: object
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: "Success"
        messageLocalized:
          type: string
          example: "Success"
        data:
          type: array
          items:
            $ref: '#/components/schemas/HomeSection'

    BannerPayload:
      type: object
      required:
        - imageUrl
        - deepLink
      properties:
        imageUrl:
          type: string
          example: "/images/banners/home-hero.jpg"
        deepLink:
          type: string
          example: "/products?collection=summer"

    CategoryRailPayload:
      type: object
      required:
        - items
        - viewAll
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CategorySummary'
        viewAll:
          $ref: '#/components/schemas/ViewAllAction'

    ProductRailPayload:
      type: object
      required:
        - items
        - viewAll
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        viewAll:
          $ref: '#/components/schemas/ViewAllAction'

    OccasionRailPayload:
      type: object
      required:
        - items
        - viewAll
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OccasionSummary'
        viewAll:
          $ref: '#/components/schemas/ViewAllAction'

    CategorySummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Birthday Flowers"
        imageUrl:
          type: string
          nullable: true
        deepLink:
          type: string
          example: "/categories/10000000-0000-0000-0000-000000000001"

    AdminCategory:
      type: object
      description: Category as seen by an administrator, including archived ones.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Birthday Flowers"
        imageUrl:
          type: string
          nullable: true
        sortOrder:
          type: integer
          example: 1
        isActive:
          type: boolean
          description: false means archived; hidden from customers but deep links answer 410.
          example: true

    ProductSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Classic Red Roses"
        imageUrl:
          type: string
          nullable: true
        price:
          type: number
          format: decimal
          example: 499
        categoryId:
          type: string
          format: uuid
          nullable: true
        occasionId:
          type: string
          format: uuid
          nullable: true
        deepLink:
          type: string
          example: "/products/40000000-0000-0000-0000-000000000001"

    OccasionSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Wedding"
        imageUrl:
          type: string
          nullable: true
        deepLink:
          type: string
          example: "/occasions/20000000-0000-0000-0000-000000000001"

    ViewAllAction:
      type: object
      required:
        - label
        - deepLink
      properties:
        label:
          type: string
          example: "View All"
        deepLink:
          type: string
          example: "/products?sort=best_sellers"

    FieldConflictResult:
      type: object
      properties:
        isSuccess:
          type: boolean
          example: false
        statusCode:
          type: integer
          example: 409
        message:
          type: string
          example: "Email already registered"
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    ValidationErrorResult:
      type: object
      properties:
        isSuccess:
          type: boolean
          example: false
        statusCode:
          type: integer
          example: 422
        message:
          type: string
          example: "Customer registration validation failed."
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            Email: ["Email already registered"]
            PhoneNumber: ["Phone number already registered"]

    OperationResult:
      type: object
      properties:
        isSuccess:
          type: boolean
        statusCode:
          type: integer
        message:
          type: string
        errors:
          type: array
          items:
            type: string
