name: CI/CD Docker Pipeline - Team 1

on:
  push:
    branches: [ "main", "master", "Development" ]
  pull_request:
    branches: [ "main", "master", "Development" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service_name: apigateway
            dockerfile: "API Gateway/Dockerfile"
            image_name: flower-apigateway-team1
          - service_name: identity-service
            dockerfile: "Identity service/Dockerfile"
            image_name: flower-identity-service-team1
          - service_name: address-service
            dockerfile: "Address & Store Coverage Service/Dockerfile"
            image_name: flower-address-service-team1
          - service_name: cart-service
            dockerfile: "Cart Service/Dockerfile"
            image_name: flower-cart-service-team1
          - service_name: catalog-service
            dockerfile: "Catalog Service/Dockerfile"
            image_name: flower-catalog-service-team1
          - service_name: order-service
            dockerfile: "Order & Fulfillment Service/Dockerfile"
            image_name: flower-order-service-team1
          - service_name: payment-service
            dockerfile: "Payment Service/Dockerfile"
            image_name: flower-payment-service-team1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Docker Username (Lowercase)
        id: prep
        run: |
          DOCKER_USER=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          echo "username=${DOCKER_USER}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/Development') }}
          provenance: false
          tags: |
            ${{ steps.prep.outputs.username }}/${{ matrix.image_name }}:latest
            ${{ steps.prep.outputs.username }}/${{ matrix.image_name }}:${{ github.sha }}
